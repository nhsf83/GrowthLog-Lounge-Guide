<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073d35">
  <meta name="description" content="Growth Lounge 현장 이용안내로 이동합니다.">
  <title>Growth Lounge Space Guide</title>

  <script>
    const target = new URL('./guide/', window.location.href);
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=./guide/">
  </noscript>

  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      color: #0b2f32;
      background: #fbf8f1;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 28rem);
      padding: 2rem;
      border: 1px solid #d8e3dc;
      border-radius: 1.5rem;
      background: #fffefa;
    }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { margin: 0; color: #64756f; }
    a {
      display: inline-flex;
      min-height: 3rem;
      margin-top: 1.5rem;
      padding: .75rem 1rem;
      align-items: center;
      border-radius: .9rem;
      color: white;
      background: #073d35;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #66a98a; outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <h1>Growth Lounge</h1>
    <p>현장 이용안내로 이동하고 있습니다.</p>
    <a href="./guide/">현장 이용안내로 이동</a>
  </main>
</body>
</html>
